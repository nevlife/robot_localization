navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    # Field-tune: vectornav yaw vs UTM grid east (magnetic declination +
    # mounting offset). Start at 0, calibrate on the first field run.
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: false
    use_odometry_yaw: true

    # map frame == graph-map frame: datum is graph-map node[0]
    # (record_20260630_141709_map_d1.json). CHANGE together with the map.
    wait_for_datum: true
    datum: [35.91361, 128.80308, 0.0]
