navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.1
    magnetic_declination_radians: 0.0 #-0.14993 #자기편각 : -0.14993rad, 35.913740° N, 128.803957° E 
    yaw_offset: 3.14159
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false