    alpha: 0.001
    kappa: 0.0
    beta: 2.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Wheel odom as differential (r_l differentiates the pose into a velocity) so it
    # does not fight the absolute GPS position that anchors the map frame. Only x/y
    # (planar dead-reckoning between GPS fixes); heading is the IMU's job.
    odom0: /odometry/wheel
    odom0_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: true
    odom0_relative: false

    # GPS position from navsat_transform (map frame): absolute x/y.
    odom1: odometry/gps
    odom1_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false

    # IMU: absolute yaw (anchors the map heading; GPS gives position, not heading) +
    # yaw rate. 2D mode zeroes roll/pitch, so only yaw/vyaw matter. No linear accel.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
