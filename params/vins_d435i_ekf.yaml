navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0   # no magnetometer used
    yaw_offset: 0.0                     # no magnetometer used
    zero_altitude: true                 # ground vehicle: ignore noisy GPS altitude
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true              # heading from VINS/EKF odom (no magnetometer); GPS course anchors it
    wait_for_datum: false

