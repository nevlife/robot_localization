navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    # Sim: Webots inertial_unit reports absolute yaw in the world frame, so no real
    # magnetic declination. Adjust once GPS is active if the map heading is rotated.
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
