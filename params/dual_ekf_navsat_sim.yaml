ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Wheel odom as differential (r_l differentiates the pose into a velocity) so it
    # does not fight the absolute GPS position that anchors the map frame. Only x/y
    # (planar dead-reckoning between GPS fixes); heading is the IMU's job (skid-steer).
    odom0: /diffdrive_controller/odom
    odom0_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: true
    odom0_relative: false

    # GPS position from navsat_transform (map frame): absolute x/y.
    odom1: odometry/gps
    odom1_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false

    # IMU: absolute roll/pitch (level the map) + angular velocities. No linear accel.
    imu0: imu
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
